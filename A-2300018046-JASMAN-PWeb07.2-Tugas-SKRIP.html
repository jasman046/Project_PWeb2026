<!DOCTYPE html>
<html lang="id">
<head>
    <title>Tugas Javascript Dasar - Jasman</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        .container {
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
            width: 90%;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        h3 {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Konversi Nilai ke Huruf</h2>
        <label for="nilaiInput">Masukkan Nilai Angka (0-100):</label><br>
        <input type="number" id="nilaiInput" min="0" max="100" placeholder="Contoh: 85"><br>
        <button onclick="evaluasiNilai()">Cek Nilai Huruf</button>
        <h3 id="hasil"></h3>
    </div>

    <script>
        function evaluasiNilai() {
            // 1. Mengambil nilai input dari elemen HTML
            let inputElement = document.getElementById("nilaiInput").value;
            
            // Validasi jika input kosong
            if (inputElement === "") {
                document.getElementById("hasil").innerHTML = "<span style='color:red;'>Silakan masukkan angka terlebih dahulu!</span>";
                return;
            }

            // Konversi nilai input menjadi tipe data number/integer
            let nilaiAngka = parseInt(inputElement);
            let hasilHuruf = "";

            // 2. Evaluasi menggunakan IF, ELSE IF sesuai kriteria soal
            if (nilaiAngka >= 0 && nilaiAngka <= 20) {
                hasilHuruf = "E";
            } else if (nilaiAngka >= 21 && nilaiAngka <= 39) {
                hasilHuruf = "D";
            } else if (nilaiAngka >= 40 && nilaiAngka <= 64) {
                hasilHuruf = "C";
            } else if (nilaiAngka >= 65 && nilaiAngka <= 79) {
                hasilHuruf = "B";
            } else if (nilaiAngka >= 80 && nilaiAngka <= 100) {
                hasilHuruf = "A";
            } else {
                // Menangani nilai di luar rentang 0-100
                hasilHuruf = "Tidak Valid (Masukkan 0 - 100)";
            }

            // 3. Menampilkan hasil ke elemen HTML
            if (hasilHuruf.length === 1) {
                document.getElementById("hasil").innerHTML = "Hasil Nilai Huruf: <strong style='color:blue; font-size:24px;'>" + hasilHuruf + "</strong>";
            } else {
                document.getElementById("hasil").innerHTML = "<span style='color:red;'>" + hasilHuruf + "</span>";
            }
        }
    </script>

</body>
</html>
